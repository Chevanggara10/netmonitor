# Alternatif systemd. Jalankan dari folder project:  docker compose -f deploy/docker-compose.yml up -d
services:
  web:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment: {DATABASE_URL: "sqlite+aiosqlite:////data/netmonitor.db", BACKUP_DIR: /data/backups}
    volumes: ["netmonitor-data:/data", "../training/models:/app/training/models"]
    restart: always
    ports: ["127.0.0.1:8000:8000"]
  bot:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: python run_telegram_bot.py
    env_file: ../.env
    environment: {DATABASE_URL: "sqlite+aiosqlite:////data/netmonitor.db"}
    volumes: ["netmonitor-data:/data"]
    restart: on-failure
    depends_on: [web]
volumes: {netmonitor-data: {}}
